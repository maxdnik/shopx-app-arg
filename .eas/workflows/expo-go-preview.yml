name: ShopX 1.4.0 Expo Go preview
on:
  push:
    branches: ['preview/expo-go-1.4.0']
jobs:
  publish:
    name: Publish ShopX preview for Expo Go
    type: update
    environment: production
    params:
      branch: expo-go-1.4.0
      platform: all
      message: ShopX 1.4.0 - nuevo inicio ecommerce para probar en Expo Go
    hooks:
      before_update:
        - run: npm run typecheck && npm run test:parity
